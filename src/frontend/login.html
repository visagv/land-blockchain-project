<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login — LandChain</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-left">
      <div class="brand-row">
        <a href="index.html" class="brand" style="color: var(--ink);">
          <svg class="seal-mark" viewBox="0 0 40 40" width="24" height="24" aria-hidden="true">
            <circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="1.6" />
            <circle cx="20" cy="20" r="13.5" fill="none" stroke="currentColor" stroke-width="1" />
            <path d="M13 20.5l5 5 9-11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          LandChain
        </a>
        <div class="switch-link">New here? <a href="register.html">Register</a></div>
      </div>

      <div class="auth-form-wrap">
        <h1>Welcome back</h1>
        <p class="subtitle">Login as a Citizen or a Land Officer.</p>

        <form id="loginForm">
          <label>Email</label>
          <input type="email" id="email" required />

          <label>Password</label>
          <input type="password" id="password" required />

          <button type="submit">Login</button>
        </form>

        <div id="msg" class="msg"></div>
      </div>
    </div>

    <div class="auth-right">
      <div class="quote">Every approval is <span>sealed on-chain</span> — permanent, and checkable by anyone.</div>
      <svg class="watermark" viewBox="0 0 240 240" aria-hidden="true">
        <path id="wmCircle" d="M 20,120 a 100,100 0 1,1 200,0 a 100,100 0 1,1 -200,0" fill="none" />
        <text><textPath href="#wmCircle" startOffset="2%">Verified on chain &#8226; Verified on chain &#8226; </textPath></text>
        <circle cx="120" cy="120" r="66" fill="none" stroke="#a9793b" stroke-width="2" />
        <path d="M88 121 l23 23 44-50" fill="none" stroke="#a9793b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <div class="foot">SHA-256 &middot; SOLIDITY &middot; GANACHE</div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (res.ok) {
          saveSession(data.token, data.user);
          showMsg("msg", "Login successful! Redirecting...", false);

          // send officer to admin dashboard, citizen to normal dashboard
          setTimeout(() => {
            window.location.href = data.user.role === "officer" ? "admin.html" : "dashboard.html";
          }, 800);
        } else {
          showMsg("msg", data.message, true);
        }
      } catch (err) {
        showMsg("msg", "Could not connect to server.", true);
      }
    });
  </script>
</body>
</html>
