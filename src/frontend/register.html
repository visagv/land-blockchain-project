<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register — LandChain</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-left">
      <div class="brand-row">
        <a href="index.html" class="brand" style="color: var(--ink);">
          <svg class="seal-mark" viewBox="0 0 40 40" width="24" height="24" aria-hidden="true">
            <circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="1.6" />
            <circle cx="20" cy="20" r="13.5" fill="none" stroke="currentColor" stroke-width="1" />
            <path d="M13 20.5l5 5 9-11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          LandChain
        </a>
        <div class="switch-link">Already registered? <a href="login.html">Login</a></div>
      </div>

      <div class="auth-form-wrap">
        <h1>Create an account</h1>
        <p class="subtitle">Register as a Citizen or as a Land Officer.</p>

        <form id="registerForm">
          <label>Full Name</label>
          <input type="text" id="name" required />

          <label>Email</label>
          <input type="email" id="email" required />

          <label>Password</label>
          <input type="password" id="password" required minlength="8" />
          <div style="font-size:12px;color:var(--soft);margin-top:5px">8+ characters, with letters and numbers</div>

          <label>Register As</label>
          <select id="role">
            <option value="citizen">Citizen</option>
            <option value="officer">Land Officer</option>
          </select>

          <button type="submit">Register</button>
        </form>

        <div id="msg" class="msg"></div>
      </div>
    </div>

    <div class="auth-right">
      <div class="quote">One record. <span>One officer.</span> One tamper-evident hash — for every land document you file.</div>
      <svg class="watermark" viewBox="0 0 240 240" aria-hidden="true">
        <path id="wmCircle2" d="M 20,120 a 100,100 0 1,1 200,0 a 100,100 0 1,1 -200,0" fill="none" />
        <text><textPath href="#wmCircle2" startOffset="2%">Verified on chain &#8226; Verified on chain &#8226; </textPath></text>
        <circle cx="120" cy="120" r="66" fill="none" stroke="#a9793b" stroke-width="2" />
        <path d="M88 121 l23 23 44-50" fill="none" stroke="#a9793b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <div class="foot">CITIZEN &middot; LAND OFFICER &middot; PUBLIC VERIFIER</div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const role = document.getElementById("role").value;
      const pe = passwordError(password);
      if (pe) return showMsg("msg", pe, true);

      try {
        const res = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password, role }),
        });
        const data = await res.json();

        if (res.ok) {
          showMsg("msg", data.message + " Redirecting to login...", false);
          setTimeout(() => (window.location.href = "login.html"), 1500);
        } else {
          showMsg("msg", data.message, true);
        }
      } catch (err) {
        showMsg("msg", "Could not connect to server.", true);
      }
    });
  </script>
</body>
</html>
