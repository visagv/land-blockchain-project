<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Upload Document — LandChain</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav>
    <a href="index.html" class="brand">
      <svg class="seal-mark" viewBox="0 0 40 40" width="26" height="26" aria-hidden="true">
        <circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="1.6" />
        <circle cx="20" cy="20" r="13.5" fill="none" stroke="currentColor" stroke-width="1" />
        <path d="M13 20.5l5 5 9-11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      LandChain
    </a>
    <div class="links">
      <a href="dashboard.html">My Documents</a>
      <a href="#" onclick="logout()">Logout</a>
    </div>
  </nav>

  <div class="container">
    <h1>Upload Land Document</h1>
    <p class="subtitle">Upload your document for officer verification.</p>

    <form id="uploadForm">
      <label>Land ID / Survey Number</label>
      <input type="text" id="landId" required />

      <label>Land Document (PDF/Image)</label>
      <input type="file" id="document" accept=".pdf,.jpg,.jpeg,.png" required />

      <button type="submit">Upload</button>
    </form>

    <div id="msg" class="msg"></div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const user = requireLogin("citizen");

    document.getElementById("uploadForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const landId = document.getElementById("landId").value.trim();
      const le = landIdError(landId);
      if (le) return showMsg("msg", le, true);
      const fileInput = document.getElementById("document");

      const formData = new FormData();
      formData.append("landId", landId);
      formData.append("document", fileInput.files[0]);

      try {
        const res = await fetch("/api/documents/upload", {
          method: "POST",
          headers: { Authorization: "Bearer " + getToken() }, // note: no Content-Type here, browser sets it for FormData
          body: formData,
        });
        const data = await res.json();

        if (res.ok) {
          showMsg("msg", data.message, false);
          setTimeout(() => (window.location.href = "dashboard.html"), 1200);
        } else {
          showMsg("msg", data.message, true);
        }
      } catch (err) {
        showMsg("msg", "Upload failed. Could not connect to server.", true);
      }
    });
  </script>
</body>
</html>
